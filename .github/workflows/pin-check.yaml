name: Pin Check
on:
  workflow_dispatch:
  pull_request: { paths: [.github/**] }
permissions:
    contents: read
jobs:
  pin-check:
    name: Pin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Check
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with: { skip_push: true }