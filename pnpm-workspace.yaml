packages:
  - 'examples/*'
  - 'packages/*'
  - 'packages/livekit-rtc/npm/*'

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@livekit/*'
  # Renovate security update: vite@6.4.3
  - vite@6.4.3
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: brace-expansion@5.0.12
  - brace-expansion@5.0.12

catalog:
  '@livekit/protocol': 1.51.0

# Security: force patched versions of transitive deps that parents pin to vulnerable versions.
overrides:
  brace-expansion@<1.1.21: ^5.0.0
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  glob@>=10.2.0 <10.5.0: ^10.5.0
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  rollup@>=4.0.0 <4.59.0: ^4.59.0
